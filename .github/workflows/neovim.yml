on:
 push:
  branches:
   - master

jobs:
 build:
  runs-on: ubuntu-latest

  container:
   image: archlinux:latest

  permissions:
   contents: write

  steps:
   - name: Generate Neovim Package
     run: |
      pacman --noconfirm -Syu \
      git \
      devtools \
      debugedit \
      base-devel

   - name: Checkout
     run: |
      git clone https://github.com/TerminalMan/arch_packages

   - name: Check for new Version
     id: version
     run: |
      cd "$GITHUB_WORKSPACE/arch_packages/neovim"
      if [[ $(./newest_available_tag.sh) != $(./last_built_tag.sh) ]]; then
       echo "new_version=true" >> "$GITHUB_OUTPUT"
       ./newest_available_tag.sh
      else
       echo "new_version=false" >> "$GITHUB_OUTPUT"
      fi

   - name: Update PKGBUILD
     if: steps.version.outputs.new_version == 'true'
     run: |
      cd "$GITHUB_WORKSPACE/arch_packages/neovim"
      sed -i "s/^pkgver=.*/pkgver=$(./newest_available_tag.sh)/" PKGBUILD

   - name: Build Package
     if: steps.version.outputs.new_version == 'true'
     run: |
      cp -r "$GITHUB_WORKSPACE/arch_packages/neovim" /tmp/
      useradd -m builder
      echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
      chmod 440 /etc/sudoers.d/builder
      chown -R builder:builder /tmp/neovim
      cd /tmp/neovim
      su builder -c 'makepkg -sf --noconfirm'
      ls -lah /tmp/neovim
      rm neovim-debug*
      tar -czf neovim.tar.gz neovim-*.pkg.tar.zst

    - name: Add to Repo
     if: steps.version.outputs.new_version == 'true'
     run: |
      cd "$GITHUB_WORKSPACE/arch_packages/repository/x86_64"
      repo-add repo.db.tar.gz /tmp/neovim/neovim-*.pkg.tar.zst
      ls

